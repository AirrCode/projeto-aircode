<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icon/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style_cadastro_login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Aircode - Cadastro</title>
    
</head>

<body>

    <div class="container">

        <div class="formulario_lado">
            <a href="index.html" class="voltar">
                <img src="assets/imgs/seta_voltar.png" alt="">
            </a>

            <div class="formulario">
                <h2>Cadastro</h2>

                <div class="campo">
                    <label for="ipt_empresa">Razão Social</label>
                    <input type="text" id="ipt_empresa" placeholder="Razão social da empresa">
              
                    <label for="ipt_nome">Nome Completo</label>
                    <input type="text" id="ipt_nome" placeholder="Seu nome">
                
                    <label for="ipt_email">E-mail</label>
                    <input type="email" id="ipt_email" placeholder="Seu e-mail">
                
                    <label for="ipt_cnpj">CNPJ</label>
                    <input type="text" id="ipt_cnpj" placeholder="00.000.000/0000-00" maxlength="18" inputmode="numeric">
                </div>

                <div class="campo campo_senha">
                    <label for="ipt_senha">Senha</label>
                    <input type="password" id="ipt_senha" placeholder="Sua senha">
                    <i id="olho" class="fa-solid fa-eye olho"></i>
                
                    <label for="ipt_senha_confirmar">Confirmar Senha</label>
                    <input type="password" id="ipt_senha_confirmar" placeholder="Confirme sua senha">
                    <i id="olho2" class="fa-solid fa-eye olho"></i>
                </div>

                <div class="campo">
                    <label for="ipt_setor">Tipo de empresa</label>
                    <select id="ipt_setor">
                        <option value="" selected disabled>Selecione o tipo de empresa</option>
                        <option value="AGENCIA">Agência de viagens</option>
                        <option value="HOTEL">Hotel</option>
                    </select>

                    <label for="ipt_cargo">Cargo</label>
                    <select id="ipt_cargo">
                        <option value="" selected disabled>Selecione o cargo</option>
                        <option value="representante">Representante</option>
                    </select>
                </div>

                <button class="botao_entrar" onclick="cadastrar()">Criar Conta</button>
                <p class="link_alt">Já tem uma conta? <a href="login_usuario.html">Entrar</a></p>
            </div>
        </div>

        <div class="foto_lado">
            <div class="foto_conteudo">
                <img src="assets/home/logo_texto_preto.png" alt="">
                <p>Transforme informações em insights estratégicos para seu negócio.</p>
            </div>
        </div>

    </div>

</body>

</html>

<script>
    const entradaSenha = document.getElementById("ipt_senha");
    const entradaSenhaConfirmar = document.getElementById("ipt_senha_confirmar");
    const olho = document.getElementById("olho");
    const olho2 = document.getElementById("olho2");
    const entradaCnpj = document.getElementById("ipt_cnpj");

    function mostrarSenha(){
        if (entradaSenha.type === "password") {
            entradaSenha.type = "text";
        } else {
            entradaSenha.type = "password";
        }
    }

    olho.addEventListener("click", mostrarSenha);

    function mostrarSenha2(){
        if (entradaSenhaConfirmar.type === "password") {
            entradaSenhaConfirmar.type = "text";
        } else {
            entradaSenhaConfirmar.type = "password";
        }
    }

    olho2.addEventListener("click", mostrarSenha2);

    entradaCnpj.addEventListener("input", function () {
        let numeros = entradaCnpj.value.replace(/\D/g, "").slice(0, 14);
        let cnpjFormatado = numeros;

        if (numeros.length > 2) {
            cnpjFormatado = numeros.slice(0, 2) + "." + numeros.slice(2);
        }
        if (numeros.length > 5) {
            cnpjFormatado = cnpjFormatado.slice(0, 6) + "." + numeros.slice(5);
        }
        if (numeros.length > 8) {
            cnpjFormatado = cnpjFormatado.slice(0, 10) + "/" + numeros.slice(8);
        }
        if (numeros.length > 12) {
            cnpjFormatado = cnpjFormatado.slice(0, 15) + "-" + numeros.slice(12);
        }

        entradaCnpj.value = cnpjFormatado;
    });

    function cadastrar() {

        let razaoSocialVar = ipt_empresa.value.trim()
        let nomeVar = ipt_nome.value
        let emailVar = ipt_email.value
        let cnpjVar = ipt_cnpj.value.replace(/\D/g, "")
        let senhaVar = ipt_senha.value
        let senha2Var = ipt_senha_confirmar.value
        let cargoVar = ipt_cargo.value
        let setorVar = ipt_setor.value
        let campos = [razaoSocialVar, nomeVar, emailVar, cnpjVar, senhaVar, senha2Var, cargoVar, setorVar];
        let temEspecial = false;
        let especiais = "!@#$%^&*()_+-=[]{}|;:'\",.<>?/";


        for (let i = 0; i < campos.length; i++) {
            if (campos[i] == "") {
                alert( 'Preencha todos os campos')
                return false;
            }
        }

        for (let i = 0; i < senhaVar.length; i++) {
            if (especiais.includes(senhaVar[i])) {
                temEspecial = true;
                break;
            }
        }

        if (!emailVar.includes('@') || !emailVar.includes('.')) {
            alert("Insira um email válido")
            return false

        } else if (senhaVar.length < 8) {
            alert("A senha deve ter no mínimo 8 caracteres")
            return false

        } else if (cnpjVar.length !== 14) {
            alert("Insira um CNPJ válido")
            return false

        } else if (senhaVar == senhaVar.toUpperCase()) {
            alert("A senha deve ter letras minúsculas")
            return false

        } else if (senhaVar == senhaVar.toLowerCase()) {
            alert("A senha deve ter letras maiúsculas")
            return false

        } else if (!temEspecial) {
            alert("A senha deve ter pelo menos 1 caractere especial")
            return false

        } else if (senhaVar != senha2Var) {
            alert("As senhas devem ser iguais")
            return false

        }

        // Enviando o valor da nova input
        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                razaoSocialServer: razaoSocialVar,
                nomeServer: nomeVar,
                cnpjServer: cnpjVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
                cargoServer: cargoVar,
                setorServer: setorVar
            }),
        })
            .then(async function (resposta) {
                let textoResposta = await resposta.text();
                let resultado = {};

                if (textoResposta) {
                    try {
                        resultado = JSON.parse(textoResposta);
                    } catch (erro) {
                        resultado = { mensagem: textoResposta };
                    }
                }
                if (!resposta.ok) {
                    throw new Error(resultado.mensagem || "Não foi possível realizar o cadastro.");
                }

                alert(resultado.mensagem || "Cadastro realizado com sucesso!");
                limparFormulario();
                setTimeout(() => {
                    window.location = "login_usuario.html";
                }, 1000);
            })
            .catch(function (erro) {
                alert(erro.message || "Não foi possível conectar ao servidor.");
            });

        return false;
    }

    function limparFormulario() {
        ipt_empresa.value = ''
        ipt_nome.value = ''
        ipt_email.value = ''
        ipt_cnpj.value = ''
        ipt_senha.value = ''
        ipt_senha_confirmar.value = ''
        ipt_cargo.value = ''
        ipt_setor.value = ''
    }
</script>
