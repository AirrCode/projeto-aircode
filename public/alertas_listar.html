<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icon/logo.png" type="image/png">
    <link rel="stylesheet" href="css/alertas.css">
    <title>Aircode | Alertas</title>
</head>

<body>
    <header class="cabecalho_dashboard">
        <a class="logo_dashboard" href="index.html" aria-label="Voltar para a página inicial">
            <img src="assets/imgs/logo_texto_branco.png" alt="Aircode">
        </a>

        <div class="acoes_cabecalho">
            <a class="botao_pagina_inicial" href="index.html">Página inicial</a>
            <a class="link_voltar_dashboard" href="dashboard.html">← Voltar à dashboard</a>
            <div class="perfil_usuario">
                <div class="imagem_perfil">
                    <img src="assets/imgs/usuario.png" alt="Imagem do usuário">
                </div>
            </div>
        </div>
    </header>

    <main class="principal_alerta">
        <div class="topo_alertas">
            <div>
                <p class="texto_pequeno">Acompanhe suas métricas</p>
                <h1>Alertas</h1>
            </div>

            <a class="botao_adicionar_alerta" href="alertas_criacao.html">
                <span>+</span>
                Adicionar alerta
            </a>
        </div>

        <input class="busca_alertas" type="search" placeholder="Buscar alerta" aria-label="Buscar alerta">

        <div class="tabela_alertas_area">
            <table class="tabela_alertas">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th class="coluna_criador">Criador</th>
                        <th>Âncora</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tabela_corpo_alertas">
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/lista_alertas.js"></script>

</body>

</html>
