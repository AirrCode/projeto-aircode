<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icon/logo.png" type="image/png">
    <link rel="stylesheet" href="css/alertas.css">
    <title>Aircode | Criação de alerta</title>
</head>

<body>
    <header class="cabecalho_dashboard">
        <a class="logo_dashboard" href="index.html" aria-label="Voltar para a página inicial">
            <img src="assets/imgs/logo_texto_branco.png" alt="Aircode">
        </a>

        <div class="acoes_cabecalho">
            <a class="botao_pagina_inicial" href="index.html">Página inicial</a>
            <a class="link_voltar_dashboard" href="dashboard.html">← Voltar à dashboard</a>
            <div class="perfil_usuario">
                <div class="imagem_perfil">
                    <img src="assets/imgs/usuario.png" alt="Imagem do usuário">
                </div>
            </div>
        </div>
    </header>

    <main class="principal_alerta">
        <p class="texto_pequeno">Personalize seus alertas</p>
        <h1>Criação de alerta</h1>

        <form class="formulario_alerta" id="formulario_alerta">
            <div class="layout_formulario">

                <div class="coluna_esquerda">
                    <div class="campo">
                        <label for="nome_alerta">NOME</label>
                        <input type="text" id="nome_alerta" name="nome" required>
                    </div>

                    <div class="campo">
                        <label for="metrica_alvo">ÂNCORA ALVO</label>
                        <select id="metrica_alvo" name="metrica_alvo" required>
                            <option value="">Selecione uma âncora</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="filtro_especifico">FILTRO ESPECÍFICO (OPCIONAL)</label>
                        <select id="filtro_especifico" name="filtro_especifico">
                            <option value="">Selecione um filtro</option>
                        </select>
                    </div>
                </div>

                <div class="coluna_direita">
                    <div class="campo campo_textarea">
                        <label for="mensagem_alerta">MENSAGEM DE ALERTA</label>
                        <textarea id="mensagem_alerta" name="mensagem_alerta" rows="8"></textarea>
                    </div>
                </div>

            </div>

            <div class="acoes_formulario">
                <button type="submit" class="botao_enviar_alerta">Enviar</button>
            </div>
        </form>
    </main>

    <script src="js/alertas.js"></script>
</body>

</html>
